  <style>
/* ============================================================
   MARINA MOHSEN — PORTFOLIO DESIGN SYSTEM
   Deep Forest & Obsidian Slate Palette (Inspired by Selina Meusel)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* Dark Forest Obsidian Theme */
  --bg:            #0d110f;
  --bg-surface:    #141a16;
  --bg-card:       #18221b;
  --bg-card-hover: #1f2d24;
  --bg-forest:     #172a1e;
  --border:        rgba(183, 194, 182, 0.14);
  --border-light:  rgba(183, 194, 182, 0.08);
  --border-accent: rgba(169, 194, 166, 0.35);

  /* Typography Colors */
  --ink:           #f1f3f0;
  --ink-secondary: #b7c2b6;
  --ink-muted:     #7d8a7c;
  
  /* Accent Greens */
  --acc:           #a9c2a6;
  --acc-glow:      rgba(169, 194, 166, 0.15);
  --acc-bright:    #2fbe84;
  --acc-emerald:   #34d399;

  /* Sizing & Geometry */
  --radius-sm:     8px;
  --radius-md:     14px;
  --radius-lg:     22px;
  --max-w:         1100px;
  --shadow:        0 12px 36px rgba(0, 0, 0, 0.45);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(38, 63, 46, 0.45), transparent 75%),
    radial-gradient(ellipse 70% 50% at 85% 40%, rgba(27, 48, 34, 0.3), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── Typography ── */
h1, h2, h3, .serif {
  font-family: 'Instrument Serif', Georgia, serif;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--ink);
}

h1 { font-size: clamp(3rem, 6.5vw, 4.8rem); }
h2 { font-size: clamp(2.2rem, 4.5vw, 3.4rem); }
h3 { font-size: 1.65rem; }
p { color: var(--ink-secondary); font-size: 1rem; line-height: 1.7; }

/* ── Layout ── */
.container { max-width: var(--max-w); margin: 0 auto; padding: 0 32px; }
section { padding: 90px 0; }
section + section { border-top: 1px solid var(--border-light); }

/* ── Navigation ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(13, 17, 15, 0.85);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-light);
  height: 68px;
  display: flex; align-items: center;
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto; width: 100%; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 1.45rem;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.nav-logo span { color: var(--acc); font-style: italic; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--ink-secondary);
  transition: color 0.2s;
  letter-spacing: 0.2px;
}
.nav-links a:hover { color: var(--ink); }
.nav-cv {
  font-size: 0.8rem;
  font-weight: 600;
  background: var(--acc-glow);
  color: var(--ink);
  border: 1px solid var(--border-accent);
  padding: 8px 18px;
  border-radius: 100px;
  transition: all 0.25s;
}
.nav-cv:hover {
  background: var(--acc);
  color: var(--bg);
}

/* ── Hero Top Panel ── */
#hero {
  min-height: 85vh;
  padding-top: 100px;
  display: flex; align-items: center;
}
.hero-panel {
  background: linear-gradient(145deg, rgba(24, 34, 27, 0.85) 0%, rgba(17, 24, 19, 0.95) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 56px 64px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 56px;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero-panel::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(47, 190, 132, 0.08) 0%, transparent 70%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.8rem; font-weight: 600;
  color: var(--acc);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--acc-bright);
  box-shadow: 0 0 8px var(--acc-bright);
}
.hero-title { margin-bottom: 12px; }
.hero-title em { font-style: italic; color: var(--acc); font-family: inherit; }
.hero-role {
  font-size: 1.25rem;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 24px;
  letter-spacing: -0.2px;
}
.hero-role span { color: var(--ink-muted); font-weight: 400; font-size: 1rem; }
.hero-bio {
  font-size: 1.05rem;
  color: var(--ink-secondary);
  line-height: 1.8;
  max-width: 580px;
  margin-bottom: 32px;
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 24px;
  border-radius: 100px;
  font-size: 0.875rem;
  font-weight: 600;
  transition: all 0.25s;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover {
  background: var(--acc);
  color: var(--bg);
}
.btn-ghost {
  background: rgba(255, 255, 255, 0.04);
  color: var(--ink);
  border: 1px solid var(--border);
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--acc);
}

.hero-photo-wrap {
  width: 260px; height: 320px;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.hero-photo {
  width: 100%; height: 100%; object-fit: cover;
}
.hero-photo-empty {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--ink-muted);
  font-size: 0.8rem; text-align: center;
  padding: 20px;
}

/* ── Section Header ── */
.section-meta {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 48px;
}
.section-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--acc);
  margin-bottom: 8px;
}

/* ── Selina-Inspired Project Panels (Not Boring Cards!) ── */
.projects-container {
  display: flex; flex-direction: column; gap: 36px;
}
.project-panel {
  background: linear-gradient(160deg, rgba(24, 34, 27, 0.9) 0%, rgba(16, 23, 18, 0.95) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow);
}
.project-panel:hover {
  border-color: var(--border-accent);
  transform: translateY(-4px);
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
}

.panel-content-split {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  min-height: 440px;
}

/* Media Showcase Area (Videos / Clean Interactive Demos) */
.panel-media-side {
  background: #090c0a;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--border-light);
}
.panel-media-side video,
.panel-media-side img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.6s ease;
}
.project-panel:hover .panel-media-side video,
.project-panel:hover .panel-media-side img {
  transform: scale(1.02);
}

.media-placeholder-panel {
  width: 100%; height: 100%; min-height: 360px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--ink-muted);
  background: radial-gradient(circle at center, #1b261e 0%, #0d120e 100%);
  padding: 32px; text-align: center;
}
.media-placeholder-panel .play-circle {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(169, 194, 166, 0.1);
  border: 1px solid var(--border-accent);
  display: flex; align-items: center; justify-content: center;
  color: var(--acc); font-size: 1.4rem;
  transition: all 0.25s;
}
.project-panel:hover .media-placeholder-panel .play-circle {
  background: var(--acc);
  color: var(--bg);
  transform: scale(1.1);
}

/* Info Side */
.panel-info-side {
  padding: 44px 48px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.panel-header-badge {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.panel-badge {
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.5px;
  padding: 5px 13px; border-radius: 100px;
  background: rgba(169, 194, 166, 0.1);
  color: var(--acc);
  border: 1px solid rgba(169, 194, 166, 0.25);
}
.panel-date { font-size: 0.8rem; color: var(--ink-muted); }
.panel-title {
  font-family: 'Instrument Serif', serif;
  font-size: 2.1rem;
  line-height: 1.15;
  margin-bottom: 12px;
  color: var(--ink);
}
.panel-summary {
  font-size: 0.95rem;
  color: var(--ink-secondary);
  line-height: 1.7;
  margin-bottom: 24px;
}

.panel-metrics-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 16px 0;
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 24px;
}
.metric-box .metric-val {
  font-family: 'Instrument Serif', serif;
  font-size: 1.6rem;
  color: var(--ink);
  line-height: 1;
}
.metric-box .metric-lbl {
  font-size: 0.72rem;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

.panel-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 28px; }
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.03);
  color: var(--ink-secondary);
  border: 1px solid var(--border-light);
}

.panel-footer-action {
  display: flex; align-items: center; justify-content: space-between;
}
.view-case-study {
  font-size: 0.875rem; font-weight: 600;
  color: var(--acc);
  display: inline-flex; align-items: center; gap: 6px;
  transition: transform 0.2s;
}
.project-panel:hover .view-case-study {
  transform: translateX(4px);
  color: var(--ink);
}

/* ── Experience Section ── */
.timeline { display: flex; flex-direction: column; gap: 24px; }
.timeline-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 32px 36px;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 32px;
  transition: border-color 0.2s;
}
.timeline-item:hover { border-color: var(--border-accent); }
.timeline-dates { font-size: 0.85rem; color: var(--ink-muted); }
.timeline-role { font-size: 1.15rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.timeline-org { font-size: 0.9rem; color: var(--acc); margin-bottom: 12px; }
.timeline-desc { font-size: 0.9rem; color: var(--ink-secondary); line-height: 1.7; }

/* ── Symmetrical 2x2 Awards & Highlights Grid ── */
.highlights-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.highlight-card {
  background: linear-gradient(150deg, rgba(24, 34, 27, 0.7) 0%, rgba(16, 22, 18, 0.9) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 36px;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 220px;
  transition: all 0.25s;
}
.highlight-card:hover {
  border-color: var(--border-accent);
  transform: translateY(-2px);
}
.highlight-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 16px;
}
.highlight-icon { font-size: 2rem; }
.highlight-badge {
  font-size: 0.72rem; font-weight: 600;
  padding: 4px 10px; border-radius: 100px;
  background: rgba(169, 194, 166, 0.1);
  color: var(--acc);
}
.highlight-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.6rem;
  line-height: 1.2;
  margin-bottom: 8px;
  color: var(--ink);
}
.highlight-desc { font-size: 0.875rem; color: var(--ink-secondary); line-height: 1.6; }

/* ── Publication Spotlight ── */
.pub-spotlight {
  background: linear-gradient(135deg, rgba(31, 47, 36, 0.6) 0%, rgba(17, 24, 19, 0.8) 100%);
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-lg);
  padding: 44px 48px;
  margin-top: 32px;
  position: relative;
}
.pub-spotlight .status-pill {
  display: inline-block; padding: 4px 12px; border-radius: 100px;
  font-size: 0.75rem; font-weight: 600;
  background: rgba(47, 190, 132, 0.15);
  color: var(--acc-bright);
  border: 1px solid rgba(47, 190, 132, 0.3);
  margin-bottom: 16px;
}
.pub-spotlight h3 { font-size: 1.7rem; margin-bottom: 12px; }
.pub-authors { font-size: 0.9rem; color: var(--ink-secondary); margin-bottom: 18px; }
.pub-authors strong { color: var(--acc); }
.pub-finding-box {
  background: rgba(9, 13, 10, 0.6);
  border: 1px solid var(--border-light);
  border-left: 3px solid var(--acc);
  border-radius: var(--radius-sm);
  padding: 18px 24px;
}

/* ── Contact ── */
.contact-section { text-align: center; }
.contact-grid {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 14px;
  margin-top: 36px;
}
.contact-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 13px 26px;
  font-size: 0.875rem; font-weight: 500;
  color: var(--ink);
  transition: all 0.2s;
}
.contact-btn:hover {
  border-color: var(--acc);
  color: var(--acc);
  transform: translateY(-2px);
}
.contact-btn svg { width: 17px; height: 17px; fill: currentColor; }

/* ── Footer ── */
footer {
  border-top: 1px solid var(--border-light);
  padding: 36px 32px;
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-muted);
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .hero-panel { grid-template-columns: 1fr; gap: 36px; padding: 36px 28px; }
  .hero-photo-wrap { order: -1; width: 100%; height: 260px; }
  .panel-content-split { grid-template-columns: 1fr; }
  .panel-media-side { border-right: none; border-bottom: 1px solid var(--border-light); min-height: 260px; }
  .panel-info-side { padding: 32px 24px; }
  .timeline-item { grid-template-columns: 1fr; gap: 8px; }
  .highlights-grid { grid-template-columns: 1fr; }
  .nav-links { gap: 16px; }
}

</style>

<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      background: '#141a16',
      primaryColor: '#172a1e',
      primaryBorderColor: '#a9c2a6',
      primaryTextColor: '#f1f3f0',
      lineColor: '#b7c2b6',
      fontSize: '13px'
    }
  });

  function getQueryParam(p) {
    return new URLSearchParams(window.location.search).get(p);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const storedP = localStorage.getItem('marina_projects_data');
    const projects = storedP ? JSON.parse(storedP) : PROJECTS;
    const storedProf = localStorage.getItem('marina_profile_data');
    const prof = storedProf ? JSON.parse(storedProf) : PROFILE;

    document.getElementById('nav-cv').href = prof.cv || 'assets/cv.pdf';

    const pid = getQueryParam('id') || projects[0].id;
    const idx = projects.findIndex(item => item.id === pid);
    const p = idx !== -1 ? projects[idx] : projects[0];

    document.title = `${p.title} — Marina Mohsen`;
    document.getElementById('proj-badge').textContent = p.badge || 'Project';
    document.getElementById('proj-date').textContent = p.date || '';
    document.getElementById('proj-title').textContent = p.title;
    document.getElementById('proj-subtitle').textContent = p.subtitle || p.category;

    // Metrics
    const metricsRow = document.getElementById('proj-metrics');
    if (p.metrics && p.metrics.length > 0) {
      metricsRow.innerHTML = p.metrics.slice(0, 4).map(m => `
        <div class="metric-box">
          <div class="metric-val">${m.value}</div>
          <div class="metric-lbl">${m.label}</div>
        </div>
      `).join('');
    } else {
      metricsRow.style.display = 'none';
    }

    // Links
    const linksRow = document.getElementById('proj-links');
    linksRow.innerHTML = '';
    if (p.github) {
      linksRow.innerHTML += `<a href="${p.github}" target="_blank" class="btn btn-primary">View GitHub Repository ↗</a>`;
    }
    if (p.paper) {
      linksRow.innerHTML += `<a href="${p.paper}" target="_blank" class="btn btn-ghost">Research Paper ↗</a>`;
    }

    // Media
    const mediaBox = document.getElementById('proj-media-box');
    if (p.media && p.media.type === 'video' && p.media.src) {
      mediaBox.innerHTML = `<video src="${p.media.src}" controls playsinline autoplay muted loop poster="${p.media.thumb || ''}"></video>`;
    } else if (p.media && p.media.type === 'image' && p.media.src) {
      mediaBox.innerHTML = `<img src="${p.media.src}" alt="${p.title}" />`;
    } else {
      mediaBox.innerHTML = `
        <div class="media-placeholder-panel">
          <div class="play-circle">▶</div>
          <div style="font-size:1.1rem; color:var(--ink); font-weight:500;">Interactive Demo Video</div>
          <p style="font-size:0.8rem; color:var(--ink-muted); max-width:320px;">Upload your screen recording or demo video in assets/videos/ to preview it here.</p>
        </div>
      `;
    }

    // Technical Description Writeup
    document.getElementById('proj-writeup').innerHTML = p.description || '<p>Detailed case study coming soon.</p>';

    // Prev / Next links
    const prevIdx = (idx - 1 + projects.length) % projects.length;
    const nextIdx = (idx + 1) % projects.length;
    document.getElementById('prev-btn').href = `project.html?id=${projects[prevIdx].id}`;
    document.getElementById('next-btn').href = `project.html?id=${projects[nextIdx].id}`;
  });
</script>
</body>
</html>
