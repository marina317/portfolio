<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details — Marina Mohsen</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
/* ============================================================
   MARINA MOHSEN — PORTFOLIO DESIGN SYSTEM
   Editorial Minimalist Aesthetic (Directly matching Selina Meusel)
   Warm Off-White / Sage Cream & Forest Obsidian Accents
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* Exact Selina Meusel Off-White / Cream Palette */
  --bg:            #f5f4ef;
  --bg-card:       #ffffff;
  --bg-subtle:     #eceae2;
  --border:        rgba(30, 36, 32, 0.12);
  --border-light:  rgba(30, 36, 32, 0.07);

  /* Deep Forest Green & Charcoal Ink */
  --ink:           #141916;
  --ink-secondary: #48534c;
  --ink-muted:     #78847c;

  /* Selina's Signature Forest Green Accent */
  --acc:           #1a4329;
  --acc-bright:    #245e39;
  --acc-badge:     #d7e3da;
  --acc-badge-txt: #163d24;
  --warn-badge:    rgba(196, 142, 34, 0.15);
  --warn-badge-txt:#8a6414;

  --max-w:         1140px;
  --radius-sm:     6px;
  --radius-card:   16px;
  --radius-pill:   999px;
  --shadow-card:   0 14px 44px rgba(20, 25, 22, 0.06);
}

/* ── Reset & Defaults ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Instrument Sans', -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── Typography ── */
h1, h2, h3, .serif {
  font-family: 'Instrument Serif', Georgia, serif;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.05;
  color: var(--ink);
}

h1 { font-size: clamp(3.2rem, 8vw, 6.2rem); }
h2 { font-size: clamp(2.6rem, 6vw, 4.8rem); }
h3 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); }
p { color: var(--ink-secondary); font-size: 1.02rem; line-height: 1.75; }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 clamp(1.2rem, 4vw, 2.5rem); }
section { padding: clamp(4.5rem, 11vh, 8.5rem) 0; }
section + section { border-top: 1px solid var(--border); }

/* ── Section Accent Bar (Selina Signature) ── */
.section-accent-bar {
  width: 38px;
  height: 3px;
  background-color: var(--acc);
  margin-bottom: 14px;
  border-radius: 2px;
}

/* ── Navigation ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(245, 244, 239, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  height: 64px;
  display: flex; align-items: center;
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto; width: 100%; padding: 0 clamp(1.2rem, 4vw, 2.5rem);
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 1.45rem;
  color: var(--ink);
}
.nav-logo span { color: var(--acc); }
.nav-links { display: flex; align-items: center; gap: clamp(14px, 2.2vw, 32px); }
.nav-links a {
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  color: var(--ink-secondary);
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--acc); }
.nav-cv-btn {
  background: var(--acc);
  color: #ffffff !important;
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  transition: opacity 0.2s, transform 0.2s;
}
.nav-cv-btn:hover { opacity: 0.9; transform: translateY(-1px); }

/* ── Editorial Hero (Split with Headshot Frame) ── */
#hero {
  min-height: 85vh;
  padding-top: 130px;
  padding-bottom: 70px;
  display: flex; align-items: center;
}
.hero-split {
  display: grid;
  grid-template-columns: 1.22fr 0.88fr;
  gap: clamp(2.5rem, 5vw, 4.5rem);
  align-items: center;
}
.hero-tagline {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--acc);
  font-weight: 600;
  margin-bottom: 12px;
}
.hero-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--acc);
  display: inline-block;
}
.hero-name-big {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: clamp(3.8rem, 8.5vw, 6.8rem);
  line-height: 0.95;
  color: var(--ink);
  letter-spacing: -0.025em;
  margin-bottom: 18px;
}
.hero-desc {
  font-size: clamp(1.05rem, 1.8vw, 1.25rem);
  color: var(--ink-secondary);
  line-height: 1.72;
  max-width: 620px;
  margin-bottom: 28px;
}
.hero-actions-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; border-radius: var(--radius-pill);
  font-size: 0.82rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.pill-btn-solid { background: var(--acc); color: #ffffff; }
.pill-btn-solid:hover {
  background: var(--acc-bright);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(26, 67, 41, 0.2);
}
.pill-btn-outline {
  border: 1px solid var(--border);
  color: var(--ink);
  background: rgba(255, 255, 255, 0.5);
}
.pill-btn-outline:hover {
  border-color: var(--acc);
  color: var(--acc);
  background: #ffffff;
  transform: translateY(-1px);
}

/* Hero Right Side Portrait Frame */
.hero-visual-side {
  display: flex;
  justify-content: flex-end;
}
.hero-portrait-frame {
  position: relative;
  width: 100%;
  max-width: 390px;
  aspect-ratio: 4 / 4.9;
  border-radius: 20px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid rgba(20, 25, 22, 0.1);
  box-shadow: 0 24px 60px rgba(20, 25, 22, 0.09);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
}
.hero-portrait-frame:hover {
  transform: translateY(-4px);
  box-shadow: 0 32px 72px rgba(20, 25, 22, 0.14);
}
.hero-portrait-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 12%;
  display: block;
}
.hero-portrait-tag {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
  border-radius: 999px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--ink);
  border: 1px solid rgba(20, 25, 22, 0.08);
  box-shadow: 0 4px 16px rgba(20, 25, 22, 0.06);
}
.status-indicator {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2fbe84;
  box-shadow: 0 0 0 3px rgba(47, 190, 132, 0.25);
  display: inline-block;
}

/* ── Projects Section (Exact Selina Layout with Large Numerals) ── */
.project-row {
  display: grid;
  grid-template-columns: 1fr 1.08fr;
  gap: clamp(2.5rem, 5vw, 4.5rem);
  align-items: center;
  padding: clamp(3.5rem, 8vh, 6rem) 0;
  border-top: 1px solid var(--border);
}
.project-row:first-of-type {
  border-top: none;
  padding-top: clamp(2rem, 4vh, 3rem);
}

.proj-text-side {
  display: flex; flex-direction: column; gap: 16px;
}
.proj-num {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: clamp(3rem, 5vw, 4.2rem);
  line-height: 1;
  color: var(--acc);
  display: block;
}
.proj-heading {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: clamp(2rem, 3.8vw, 2.7rem);
  line-height: 1.08;
  color: var(--ink);
  font-weight: 400;
}
.proj-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-badge {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid rgba(20, 25, 22, 0.16);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  color: var(--ink-secondary);
  background: transparent;
  font-weight: 500;
}
.pill-badge.pill-badge-status {
  border-color: rgba(180, 130, 40, 0.45);
  color: #8a6414;
  background: rgba(196, 142, 34, 0.05);
  font-weight: 600;
}
.proj-desc {
  font-size: 1.02rem;
  color: var(--ink-secondary);
  line-height: 1.72;
}
.proj-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(20, 25, 22, 0.2);
  border-radius: var(--radius-pill);
  padding: 9px 20px;
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.5);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  margin-top: 8px;
  width: fit-content;
}
.proj-pill-btn:hover {
  border-color: var(--acc);
  color: var(--acc);
  background: #ffffff;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(26, 67, 41, 0.08);
}

/* Project Media Side — Framed Art-Gallery Showcase */
.proj-media-side {
  background: #ffffff;
  border: 1px solid rgba(20, 25, 22, 0.1);
  border-radius: 16px;
  box-shadow: 0 16px 44px rgba(20, 25, 22, 0.06);
  padding: 16px;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.proj-media-side video,
.proj-media-side img {
  width: 100%; height: auto; border-radius: 10px; display: block; object-fit: cover; background: #0f1411;
}

/* ── Experience Section (Clean Minimalist List) ── */
.exp-list { display: flex; flex-direction: column; }
.exp-item {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 32px;
  padding: 32px 0;
  border-top: 1px solid var(--border);
}
.exp-item:first-child { border-top: none; }
.exp-date { font-size: 0.85rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
.exp-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
.exp-org { font-size: 0.95rem; color: var(--acc); font-weight: 500; margin-bottom: 10px; }

/* ── Highlights Section (Symmetrical 2x2 Grid) ── */
.highlights-2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.hl-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 36px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow-card);
  min-height: 200px;
}
.hl-card .num {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 2.5rem;
  color: var(--acc);
  line-height: 1;
  margin-bottom: 8px;
}
.hl-card h4 { font-family: 'Instrument Serif', Georgia, serif; font-size: 1.6rem; margin-bottom: 8px; }

/* Publication Banner */
.pub-banner {
  background: #ffffff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--acc);
  border-radius: var(--radius-card);
  padding: 40px;
  margin-top: 24px;
  box-shadow: var(--shadow-card);
}

/* ── Contact ── */
.contact-row {
  display: flex; flex-wrap: wrap; gap: 16px;
  margin-top: 32px;
}

/* ── Footer ── */
footer {
  border-top: 1px solid var(--border);
  padding: 40px 0;
  text-align: center;
  font-size: 0.85rem;
  color: var(--ink-muted);
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .hero-split { grid-template-columns: 1fr; gap: 36px; }
  .hero-visual-side { justify-content: center; }
  .hero-portrait-frame { max-width: 320px; }
  .project-row { grid-template-columns: 1fr; gap: 28px; }
  .exp-item { grid-template-columns: 1fr; gap: 8px; }
  .highlights-2x2 { grid-template-columns: 1fr; }
  .nav-links { gap: 14px; }
}


.detail-container {
  max-width: 980px;
  margin: 0 auto;
  padding: 120px clamp(1.2rem, 4vw, 2.5rem) 80px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--acc);
  margin-bottom: 32px;
  transition: transform 0.2s;
}
.back-btn:hover {
  transform: translateX(-4px);
}
.detail-head-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: clamp(28px, 5vw, 44px);
  box-shadow: var(--shadow-card);
  margin-bottom: 36px;
}
.panel-badge {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid rgba(180, 130, 40, 0.45);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  color: #8a6414;
  background: rgba(196, 142, 34, 0.05);
  font-weight: 600;
}
.panel-metrics-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 24px 0;
}
.metric-box .metric-val {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 2rem;
  color: var(--acc);
  line-height: 1;
}
.metric-box .metric-lbl {
  font-size: 0.72rem;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 6px;
}
.detail-links-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.detail-media-frame {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  padding: 16px;
  margin-bottom: 48px;
}
.detail-media-frame video,
.detail-media-frame img {
  width: 100%;
  height: auto;
  border-radius: 10px;
  display: block;
  background: #0f1411;
}
.writeup-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: clamp(28px, 5vw, 48px);
  box-shadow: var(--shadow-card);
  margin-bottom: 48px;
}
.writeup-content h2, .writeup-content h3 {
  margin: 28px 0 12px;
  color: var(--ink);
}
.writeup-content p {
  margin-bottom: 16px;
  line-height: 1.8;
}
.writeup-content pre {
  background: #141916;
  color: #eceae2;
  padding: 18px 24px;
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  overflow-x: auto;
  margin: 24px 0;
}
.nav-between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Marina Mohsen<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#experience">Experience</a></li>
      <li><a href="index.html#highlights">Highlights</a></li>
      <li><a href="interests.html">Interests</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a id="nav-cv" href="assets/cv.pdf" download class="nav-cv-btn">Download CV</a></li>
    </ul>
  </div>
</nav>

<main class="detail-container">
  <a href="index.html#projects" class="back-btn">
    ← Back to Projects
  </a>

  <!-- Header Card -->
  <header class="detail-head-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <span id="proj-badge" class="panel-badge">Featured Work</span>
      <span id="proj-date" style="font-size:0.82rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.06em;">2026</span>
    </div>
    <h1 id="proj-title" style="font-size: clamp(2.4rem, 5vw, 3.8rem); margin-bottom:12px;">Project Title</h1>
    <p id="proj-subtitle" style="font-size: 1.15rem; color: var(--acc); margin-bottom: 24px;">Project Subtitle</p>

    <div class="panel-metrics-row" id="proj-metrics">
      <!-- Injected by JS -->
    </div>

    <div class="detail-links-row" id="proj-links">
      <!-- Injected by JS -->
    </div>
  </header>

  <!-- Showcase Media Frame -->
  <div class="detail-media-frame" id="proj-media-box">
    <!-- Video or Image injected by JS -->
  </div>

  <!-- Deep Dive Writeup -->
  <article class="writeup-content" id="proj-writeup">
    <!-- Populated by JS -->
  </article>

  <!-- Navigation between projects -->
  <div class="nav-between">
    <a href="#" id="prev-btn" class="pill-btn pill-btn-outline">← Previous Project</a>
    <a href="#" id="next-btn" class="pill-btn pill-btn-outline">Next Project →</a>
  </div>
</main>

<footer>
  <p>© 2026 Marina Mohsen · AI Engineer</p>
</footer>

<script src="data/projects.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      background: '#f5f4ef',
      primaryColor: '#ffffff',
      primaryBorderColor: '#1a4329',
      primaryTextColor: '#141916',
      lineColor: '#1a4329',
      fontSize: '13px'
    }
  });

  function getQueryParam(p) {
    return new URLSearchParams(window.location.search).get(p);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const storedP = localStorage.getItem('marina_projects_data');
    const projects = storedP ? JSON.parse(storedP) : PROJECTS;
    document.getElementById('nav-cv').href = PROFILE.cv || 'assets/cv.pdf';

    const pid = getQueryParam('id') || projects[0].id;
    const idx = projects.findIndex(item => item.id === pid);
    const p = idx !== -1 ? projects[idx] : projects[0];

    document.title = `${p.title} — Marina Mohsen`;
    document.getElementById('proj-badge').textContent = p.badge || 'Project';
    document.getElementById('proj-date').textContent = p.date || '';
    document.getElementById('proj-title').textContent = p.title;
    document.getElementById('proj-subtitle').textContent = p.category;

    // Metrics
    const metricsRow = document.getElementById('proj-metrics');
    if (p.metrics && p.metrics.length > 0) {
      metricsRow.innerHTML = p.metrics.slice(0, 4).map(m => `
        <div class="metric-box">
          <div class="metric-val">${m.value}</div>
          <div class="metric-lbl">${m.label}</div>
        </div>
      `).join('');
    } else {
      metricsRow.style.display = 'none';
    }

    // Links
    const linksRow = document.getElementById('proj-links');
    linksRow.innerHTML = '';
    if (p.github) {
      linksRow.innerHTML += `<a href="${p.github}" target="_blank" rel="noopener" class="pill-btn pill-btn-solid">View GitHub Repository ↗</a>`;
    }
    if (p.paper) {
      linksRow.innerHTML += `<a href="${p.paper}" target="_blank" rel="noopener" class="pill-btn pill-btn-outline">Research Paper ↗</a>`;
    }

    // Media
    const mediaBox = document.getElementById('proj-media-box');
    if (p.media && p.media.type === 'video' && p.media.src) {
      mediaBox.innerHTML = `<video src="${p.media.src}" controls playsinline autoplay muted loop poster="${p.media.thumb || ''}"></video>`;
    } else if (p.media && p.media.type === 'image' && p.media.src) {
      mediaBox.innerHTML = `<img src="${p.media.src}" alt="${p.title}" />`;
    } else {
      mediaBox.innerHTML = `
        <div style="padding:48px; text-align:center;">
          <p style="font-size:1.1rem; color:var(--ink); font-weight:500;">Interactive Demo Video</p>
        </div>
      `;
    }

    // Technical Description Writeup
    document.getElementById('proj-writeup').innerHTML = `
      <h2>Engineering Overview</h2>
      <p>${p.summary}</p>
      ${p.detail ? `<p>${p.detail}</p>` : ''}
      ${p.tags && p.tags.length ? `
        <h3 style="margin-top:24px;">Core Technologies</h3>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">
          ${p.tags.map(t => `<span class="pill-badge">${t}</span>`).join('')}
        </div>
      ` : ''}
    `;

    // Prev / Next links
    const prevIdx = (idx - 1 + projects.length) % projects.length;
    const nextIdx = (idx + 1) % projects.length;
    document.getElementById('prev-btn').href = `project.html?id=${projects[prevIdx].id}`;
    document.getElementById('next-btn').href = `project.html?id=${projects[nextIdx].id}`;
  });
</script>
</body>
</html>
